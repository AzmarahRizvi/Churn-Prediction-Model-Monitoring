[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-prediction-model-monitoring"
version = "0.1.0"
description = "End-to-end churn prediction, FastAPI serving, and Vertex AI drift monitoring."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "xgboost>=2.0",
  "scikit-learn>=1.4",
  "pandas>=2.0",
  "numpy>=1.26",
  "joblib>=1.3",
  "google-cloud-storage>=2.10",
  "google-cloud-aiplatform>=1.49",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
churn_monitoring = ["static/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

